<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Modern Chatbox</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    /* Chat Button */
    .chat-btn {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: linear-gradient(135deg, #4e8cff, #1e5eff);
      color: #fff;
      border: none;
      width: 60px;
      height: 60px;
      border-radius: 50%;
      font-size: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 8px 20px rgba(0,0,0,0.25);
      transition: transform 0.3s;
      z-index: 1000;
    }
    .chat-btn:hover {
      transform: scale(1.1);
    }

    /* Chat Window */
    .chat-window {
      position: fixed;
      bottom: 90px;
      right: 20px;
      width: 350px;
      max-height: 500px;
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.2);
      display: none;
      flex-direction: column;
      overflow: hidden;
      font-family: 'Segoe UI', sans-serif;
      animation: fadeIn 0.3s ease-in-out;
      z-index: 1000;
    }

    /* Header */
    .chat-header {
      background: linear-gradient(135deg, #4e8cff, #1e5eff);
      color: #fff;
      padding: 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .chat-header h4 {
      margin: 0;
      font-size: 16px;
    }
    .chat-header button {
      background: none;
      border: none;
      color: #fff;
      font-size: 18px;
      cursor: pointer;
    }

    /* Messages */
    .chat-body {
      flex: 1;
      padding: 15px;
      background: #f9f9f9;
      overflow-y: auto;
    }
    .message {
      max-width: 75%;
      padding: 10px 14px;
      border-radius: 12px;
      margin: 6px 0;
      font-size: 14px;
      line-height: 1.4;
      animation: slideUp 0.2s ease;
    }
    .message.user {
      background: #1e5eff;
      color: #fff;
      margin-left: auto;
      border-bottom-right-radius: 2px;
    }
    .message.support {
      background: #eaeaea;
      color: #333;
      margin-right: auto;
      border-bottom-left-radius: 2px;
    }

    /* Input */
    .chat-footer {
      display: flex;
      align-items: center;
      padding: 10px;
      border-top: 1px solid #eee;
      background: #fff;
    }
    .chat-footer input {
      flex: 1;
      border: none;
      padding: 10px;
      border-radius: 20px;
      outline: none;
      background: #f1f1f1;
      font-size: 14px;
    }
    .chat-footer button {
      background: #1e5eff;
      border: none;
      color: #fff;
      border-radius: 50%;
      width: 38px;
      height: 38px;
      margin-left: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s;
    }
    .chat-footer button:hover {
      background: #1543b5;
    }

    /* Animations */
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes slideUp {
      from { opacity: 0; transform: translateY(5px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <!-- Chat Button -->
  <button class="chat-btn" onclick="toggleChat()">
    <i class="fas fa-comment-alt"></i>
  </button>

  <!-- Chat Window -->
  <div class="chat-window" id="chatWindow">
    <div class="chat-header">
      <h4>Customer Support</h4>
      <button onclick="toggleChat()"><i class="fas fa-times"></i></button>
    </div>
    <div class="chat-body" id="chatBody">
      <div class="message support">Hello 👋 How can we help you today?</div>
    </div>
    <div class="chat-footer">
      <input type="text" id="chatInput" placeholder="Type your message..."/>
      <button onclick="sendMessage()"><i class="fas fa-paper-plane"></i></button>
    </div>
  </div>

  <script>
    function toggleChat() {
      const chatWindow = document.getElementById('chatWindow');
      chatWindow.style.display = chatWindow.style.display === 'flex' ? 'none' : 'flex';
    }

    function sendMessage() {
      const input = document.getElementById('chatInput');
      const body = document.getElementById('chatBody');
      if (input.value.trim() !== '') {
        const msg = document.createElement('div');
        msg.classList.add('message', 'user');
        msg.textContent = input.value;
        body.appendChild(msg);
        input.value = '';
        body.scrollTop = body.scrollHeight;

        setTimeout(() => {
          const reply = document.createElement('div');
          reply.classList.add('message', 'support');
          reply.textContent = "Thanks for your message! We'll get back shortly.";
          body.appendChild(reply);
          body.scrollTop = body.scrollHeight;
        }, 1000);
      }
    }
  </script>

</body>
</html>
